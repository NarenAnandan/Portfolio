name: Deploy PR preview to Firebase Hosting
on: pull_request
permissions:
  checks: write
  contents: read
  pull-requests: write
concurrency:
  group: firebase-hosting-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a # v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PORTFOLIO_BF3E6 }}
          projectId: portfolio-bf3e6
