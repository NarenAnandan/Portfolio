name: Deploy to Firebase Hosting

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: these jobs only ever need to read the repository.
permissions:
  contents: read

# Never let two deploys race for the live channel.
concurrency:
  group: firebase-hosting-live
  cancel-in-progress: false

jobs:
  # npm and the build run here, in a job with no secrets. Only the built dist/ moves on.
  build:
    name: Build and check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Actions are pinned to an exact release tag, never a moving major tag like @v7.
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # npm ci installs exactly what package-lock.json pins; no install scripts run.
      - name: Build
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
        env:
          ASTRO_TELEMETRY_DISABLED: "1"

      # Last line of defence: PR checks should have caught anything here first.
      - name: Run site checks
        run: python3 .github/scripts/check-site.py

      - name: Upload the built site
        uses: actions/upload-artifact@v7.0.2
        with:
          name: dist
          path: dist/
          include-hidden-files: true # dist/.well-known/security.txt
          retention-days: 7

  deploy:
    name: Deploy
    needs: build
    # workflow_dispatch can target any branch; only main may reach the live channel.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://portfolio-bf3e6.web.app
    steps:
      # firebase.json is needed for the headers; no npm install happens in this job.
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Download the built site
        uses: actions/download-artifact@v8.0.2
        with:
          name: dist
          path: dist/

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0.11.0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PORTFOLIO_BF3E6 }}
          channelId: live
          projectId: portfolio-bf3e6
          firebaseToolsVersion: 15.28.2 # last version proven with this service account; 15.34+ also needs serviceusage.services.get
