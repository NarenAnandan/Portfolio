name: Deploy to Firebase Hosting

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: this job only ever needs to read the repository.
permissions:
  contents: read

# Never let two deploys race for the live channel.
concurrency:
  group: firebase-hosting-live
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://portfolio-bf3e6.web.app
    steps:
      # Third-party actions are pinned to a commit SHA, not a moving tag, so a
      # compromised or retagged release cannot silently change what runs here.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # Last line of defence — PR checks should have caught anything here first.
      - name: Run site checks
        run: python3 .github/scripts/check-site.py

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a # v0.11.0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PORTFOLIO_BF3E6 }}
          channelId: live
          projectId: portfolio-bf3e6
